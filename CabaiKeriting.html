<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Cabai Keriting | Pemeriksaan Gizi Balita</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Segoe UI',system-ui,sans-serif;
background:#020617;
}

/* =========================
   WEB APP
========================= */

iframe{
position:fixed;
inset:0;
width:100%;
height:100%;
border:0;
background:#fff;
}


/* =========================
   LOADER
========================= */

#loader{
position:fixed;
inset:0;
z-index:9999;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(
circle at center,
#064e3b 0%,
#022c22 38%,
#020617 78%
);

transition:
opacity .6s ease,
visibility .6s ease;
}

#loader::after{
content:"";

position:absolute;
inset:0;

background:
radial-gradient(
circle,
transparent 25%,
rgba(0,0,0,.55) 100%
);

pointer-events:none;
}

.hide{
opacity:0;
visibility:hidden;
}


/* =========================
   CARD
========================= */

.card{
position:relative;
z-index:2;

width:92%;
max-width:390px;

padding:30px 25px;

border-radius:28px;

background:
rgba(2,44,34,.88);

backdrop-filter:
blur(25px);

-webkit-backdrop-filter:
blur(25px);

border:
1px solid rgba(167,243,208,.25);

color:#f8fafc;

text-align:center;

box-shadow:
0 25px 70px rgba(0,0,0,.75);

text-shadow:
0 1px 3px rgba(0,0,0,.8);
}


/* =========================
   HEADER
========================= */

.header{
display:flex;
align-items:center;
justify-content:space-between;

margin-bottom:10px;
}

.label{
font-size:11px;

font-weight:700;

letter-spacing:2px;

color:#a7f3d0;
}

.status{
width:10px;
height:10px;

border-radius:50%;

background:#34d399;

box-shadow:
0 0 12px #34d399;

animation:
statusPulse 1.8s infinite;
}

@keyframes statusPulse{

0%,100%{
transform:scale(1);
opacity:1;
}

50%{
transform:scale(1.5);
opacity:.55;
}

}


/* =========================
   JUDUL
========================= */

.title{
font-size:20px;

font-weight:800;

letter-spacing:.5px;

color:#ffffff;

margin-top:5px;

text-shadow:
0 2px 8px rgba(0,0,0,.8);
}

.subtitle{
font-size:13px;

font-weight:500;

color:#d1fae5;

margin-top:7px;

line-height:1.6;
}


/* =========================
   ANIMASI GIZI
========================= */

.growth{
position:relative;

height:155px;

margin:20px 0 15px;
}


/* background circle */

.glow{
position:absolute;

width:130px;
height:130px;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

border-radius:50%;

background:
rgba(16,185,129,.08);

box-shadow:
0 0 70px rgba(16,185,129,.22);

animation:
glowPulse 3s infinite;
}

@keyframes glowPulse{

0%,100%{
transform:
translate(-50%,-50%)
scale(.9);
}

50%{
transform:
translate(-50%,-50%)
scale(1.08);
}

}


/* =========================
   BALITA
========================= */

.child{
position:absolute;

left:50%;
top:43%;

transform:
translate(-50%,-50%);

width:48px;
height:48px;

border-radius:50%;

background:
linear-gradient(
145deg,
#6ee7b7,
#10b981
);

display:flex;

align-items:center;
justify-content:center;

font-size:25px;

box-shadow:
0 0 25px rgba(52,211,153,.65);

animation:
childFloat 2.5s infinite ease-in-out;
}

@keyframes childFloat{

0%,100%{
transform:
translate(-50%,-50%)
translateY(0);
}

50%{
transform:
translate(-50%,-50%)
translateY(-7px);
}

}


/* =========================
   GARIS PENGUKURAN
========================= */

.measure{
position:absolute;

right:52px;
top:15px;

width:4px;
height:120px;

border-radius:10px;

background:
linear-gradient(
to bottom,
#a7f3d0,
#10b981
);

box-shadow:
0 0 10px rgba(52,211,153,.45);
}


/* tanda pengukuran */

.measure span{
position:absolute;

left:-8px;

width:20px;
height:2px;

background:#d1fae5;

opacity:.8;
}

.measure span:nth-child(1){
top:10px;
}

.measure span:nth-child(2){
top:35px;
}

.measure span:nth-child(3){
top:60px;
}

.measure span:nth-child(4){
top:85px;
}

.measure span:nth-child(5){
top:110px;
}


/* =========================
   BERAT / TIMBANGAN
========================= */

.scale{
position:absolute;

left:50%;
bottom:2px;

transform:
translateX(-50%);

width:105px;
height:12px;

border-radius:20px;

background:#064e3b;

border:
1px solid rgba(167,243,208,.35);

box-shadow:
0 5px 15px rgba(0,0,0,.4);
}

.scale::before{
content:"";

position:absolute;

left:50%;
top:-20px;

transform:
translateX(-50%);

width:45px;
height:20px;

border-radius:50% 50% 5px 5px;

background:#10b981;

box-shadow:
0 0 12px rgba(16,185,129,.5);
}


/* =========================
   GRAFIK PERTUMBUHAN
========================= */

.chart{
position:absolute;

left:20px;
bottom:15px;

width:65px;
height:70px;

display:flex;

align-items:flex-end;

gap:5px;
}

.chart i{
display:block;

width:10px;

border-radius:4px 4px 0 0;

background:
linear-gradient(
to top,
#10b981,
#a7f3d0
);

box-shadow:
0 0 7px rgba(52,211,153,.25);

animation:
chartGrow 2s infinite ease-in-out;
}

.chart i:nth-child(1){
height:25px;
animation-delay:.1s;
}

.chart i:nth-child(2){
height:38px;
animation-delay:.3s;
}

.chart i:nth-child(3){
height:50px;
animation-delay:.5s;
}

.chart i:nth-child(4){
height:63px;
animation-delay:.7s;
}

@keyframes chartGrow{

0%,100%{
transform:scaleY(.7);
}

50%{
transform:scaleY(1);
}

}


/* =========================
   TEKS STATUS
========================= */

.loading-text{
font-size:14px;

font-weight:600;

color:#f0fdf4;

margin-top:10px;
}

.description{
font-size:12px;

line-height:1.6;

color:#bbf7d0;

margin-top:6px;
}


/* =========================
   PROGRESS
========================= */

.progress{
margin-top:20px;

height:6px;

border-radius:20px;

background:#022c22;

overflow:hidden;

border:
1px solid rgba(167,243,208,.12);
}

.bar{
height:100%;

width:38%;

border-radius:20px;

background:
linear-gradient(
90deg,
#10b981,
#a7f3d0,
#10b981
);

animation:
loading 1.5s infinite;
}

@keyframes loading{

0%{
transform:
translateX(-130%);
}

100%{
transform:
translateX(330%);
}

}


/* =========================
   HOME BUTTON
========================= */

.home{
position:fixed;

right:18px;
bottom:18px;

width:55px;
height:55px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
rgba(2,44,34,.82);

border:
1px solid rgba(167,243,208,.3);

backdrop-filter:
blur(12px);

-webkit-backdrop-filter:
blur(12px);

z-index:99999;

box-shadow:
0 10px 30px rgba(0,0,0,.45);

transition:.3s;
}

.home:hover{
background:#10b981;

transform:
translateY(-4px)
scale(1.05);
}

.home svg{
width:26px;

fill:#ecfdf5;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

.card{
padding:27px 20px;
}

.title{
font-size:18px;
}

.growth{
height:145px;
}

}

</style>

</head>

<body>


<!-- =========================
     WEB APP
========================= -->

<iframe
id="app"
src="https://script.google.com/macros/s/AKfycbwFb7BsfOiFQ1tXKI58SzwUX5cClT8BL30MFbq7Xikbi_g7nM_WVQJAjUlRLQ6ZySCS6A/exec"
allow="geolocation">
</iframe>


<!-- =========================
     LOADER
========================= -->

<div id="loader">

<div class="card">

<div class="header">

<div class="label">
GIZI BALITA
</div>

<div class="status"></div>

</div>


<div class="title">
PEMERIKSAAN GIZI BALITA
</div>

<div class="subtitle">
Cabai Keriting<br>
Puskesmas Panjatan I
</div>


<!-- ANIMASI -->

<div class="growth">

<div class="glow"></div>


<!-- grafik -->

<div class="chart">

<i></i>
<i></i>
<i></i>
<i></i>

</div>


<!-- pengukuran -->

<div class="measure">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>


<!-- anak -->

<div class="child">
👶
</div>


<!-- timbangan -->

<div class="scale"></div>

</div>


<div class="loading-text">
Menyiapkan pemeriksaan...
</div>

<div class="description">
Pengukuran dan pemantauan pertumbuhan<br>
serta status gizi balita
</div>


<div class="progress">

<div class="bar"></div>

</div>

</div>

</div>


<!-- =========================
     HOME
========================= -->

<a
href="https://puskesmaspanjatansatu.github.io/portal-digital/"
class="home"
aria-label="Kembali ke Portal Digital">

<svg viewBox="0 0 24 24">

<path d="
M12 3.1
2.6 11
a1 1 0 0 0 .64 1.77
H5v7
a1 1 0 0 0 1 1
h4v-6
h4v6
h4a1 1 0 0 0 1-1
v-7h1.76
A1 1 0 0 0 21.4 11
L12 3.1z"/>

</svg>

</a>


<script>

const loader =
document.getElementById("loader");

const app =
document.getElementById("app");


/* Saat Web App selesai dimuat */

app.onload = function(){

setTimeout(()=>{

loader.classList.add("hide");

},500);

};


/* Fallback */

setTimeout(()=>{

loader.classList.add("hide");

},8000);

</script>

</body>
</html>
